[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "superb-memory"
version = "0.2.1"
description = "Python client, mdb CLI and MCP server for the MemoryDB Go document and agent memory database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "humaniods" }]
keywords = ["database", "document-database", "agent-memory", "langchain", "mcp", "vector-search"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers",
               "Operating System :: POSIX", "Programming Language :: Python :: 3",
               "Topic :: Database", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
[project.urls]
Homepage = "https://github.com/humaniods/MemoryDB"
Repository = "https://github.com/humaniods/MemoryDB"
Issues = "https://github.com/humaniods/MemoryDB/issues"
[project.scripts]
mdb = "cli:main"
memorydb-mcp = "memorydb_mcp:serve"
[tool.setuptools]
py-modules = ["memorydb", "cli", "memorydb_mcp"]
