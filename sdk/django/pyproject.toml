[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "memorydb-django"
version = "0.2.0"
description = "Django cache and session backends for MemoryDB (SQLite-style drop-in for the settings file)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "humaniods" }]
keywords = ["django", "cache", "sessions", "database", "agent-memory"]
classifiers = ["Development Status :: 4 - Beta", "Framework :: Django",
               "Intended Audience :: Developers", "Operating System :: POSIX",
               "Programming Language :: Python :: 3", "Topic :: Database"]
dependencies = ["sanyam-memorydb-client", "Django>=4.2"]
[tool.setuptools]
packages = ["memorydb_django"]
[project.urls]
Homepage = "https://github.com/humaniods/MemoryDB"
Repository = "https://github.com/humaniods/MemoryDB"
Issues = "https://github.com/humaniods/MemoryDB/issues"
